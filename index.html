let rubroActivo = "todos";

function abrirLb(src){document.getElementById('lb-img').src=src;document.getElementById('lb').classList.add('open');}
function cerrarLb(){document.getElementById('lb').classList.remove('open');}

function renderChips(){
  const rubros = ["todos",...new Set(profesionales.map(p=>p.rubroid))];
  document.getElementById("chips").innerHTML = rubros.map(r=>
    '<button class="chip '+(r===rubroActivo?'active':'')+'" onclick="setRubro(\''+r+'\')">'+( labelRubro[r]||r)+'</button>'
  ).join("");
}

function setRubro(r){rubroActivo=r;renderChips();filtrar();}

function fotosHTML(id){
  if(!FOTOS[id])return'';
  return '<div class="fotos-row">'+FOTOS[id].map(src=>'<img class="foto-thumb" src="'+src+'" onclick="abrirLb(this.src)" alt="trabajo" loading="lazy"/>').join('')+'</div>';
}
