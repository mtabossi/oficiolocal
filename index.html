<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oficio Local · Mercedes</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LDWC8F76VS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LDWC8F76VS');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lora:ital,wght@0,400;1,400&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --azul: #1B2E4B; --azul-medio: #2C4A72; --amarillo: #E8B84B; --blanco-roto: #F4F1EA; --gris-calido: #E8E4DB; --gris-texto: #6B6560; --texto: #1B2020; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--blanco-roto); color: var(--texto); font-family: 'Barlow', sans-serif; min-height: 100vh; }
    .header { background: var(--azul); position: relative; overflow: hidden; }
    .header-grid { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 41px), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 41px); pointer-events: none; }
    .header-inner { position: relative; max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem 1.75rem; }
    .logo-wrap { display: flex; align-items: center; gap: 14px; }
    .logo-mark { width: 48px; height: 48px; flex-shrink: 0; background: var(--amarillo); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 24px; height: 24px; }
    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-nombre { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
    .logo-ciudad { font-size: 11px; color: var(--amarillo); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; margin-top: 4px; }
    .header-tagline { font-family: 'Lora', serif; font-size: 15px; font-style: italic; color: rgba(255,255,255,0.5); margin-top: 1rem; }
    .chips-bar { background: var(--azul-medio); border-bottom: 3px solid var(--amarillo); }
    .chips-inner { max-width: 680px; margin: 0 auto; padding: 0 1.5rem; display: flex; overflow-x: auto; scrollbar-width: none; }
    .chips-inner::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 13px 18px; border: none; background: transparent; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-family: 'Barlow', sans-serif; cursor: pointer; color: rgba(255,255,255,0.55); border-bottom: 3px solid transparent; margin-bottom: -3px; transition: all 0.15s; }
    .chip:hover { color: rgba(255,255,255,0.9); }
    .chip.active { color: var(--amarillo); border-bottom-color: var(--amarillo); }
    .main { max-width: 680px; margin: 0 auto; }
    .results-bar { padding: 1.25rem 1.5rem 0.5rem; }
    .results-count { font-size: 11px; color: var(--gris-texto); text-transform: uppercase; letter-spacing: 0.12em; }
    .card-list { display: flex; flex-direction: column; padding: 0.5rem 1.5rem 1rem; gap: 1rem; }
    .card { background: #fff; border-radius: 4px; border: 1px solid var(--gris-calido); border-left: 4px solid var(--amarillo); overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; }
    .card:hover { box-shadow: 0 4px 20px rgba(27,46,75,0.1); transform: translateY(-1px); }
    .card-body { padding: 1.25rem 1.25rem 1rem; }
    .card-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; }
    .avatar { width: 46px; height: 46px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; flex-shrink: 0; letter-spacing: 0.05em; background: var(--gris-calido); color: var(--azul); }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 700; color: var(--azul); letter-spacing: 0.02em; line-height: 1.1; }
    .card-rubro { font-size: 10px; color: var(--gris-texto); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500; margin-top: 3px; }
    .card-desc { font-family: 'Lora', serif; font-size: 14px; color: #4A4540; line-height: 1.6; margin-bottom: 12px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .precio { font-size: 13px; color: var(--gris-texto); }
    .precio strong { color: var(--azul); font-weight: 600; }
    .wa-btn { display: flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 3px; background: var(--azul); color: #fff; font-size: 12px; font-weight: 600; font-family: 'Barlow', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; text-decoration: none; transition: background 0.15s; white-space: nowrap; }
    .wa-btn:hover { background: var(--azul-medio); }
    .wa-btn svg { width: 14px; height: 14px; flex-shrink: 0; fill: #25D366; }
    .ig-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gris-texto); text-decoration: none; font-weight: 500; margin-top: 4px; }
    .ig-link:hover { color: var(--azul); }
    .fotos-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 1.25rem 1.25rem; }
    .fotos-row::-webkit-scrollbar { display: none; }
    .foto-thumb { width: 100px; height: 72px; object-fit: cover; border-radius: 3px; flex-shrink: 0; cursor: pointer; border: 1px solid var(--gris-calido); transition: opacity 0.15s; }
    .foto-thumb:hover { opacity: 0.85; }
    .badge-fundador { font-size: 9px; padding: 2px 7px; border-radius: 2px; background: var(--amarillo); color: var(--azul); font-weight: 700; display: inline-block; margin-left: 8px; vertical-align: middle; font-family: 'Barlow', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
    .badge-destacado { font-size: 9px; padding: 2px 7px; border-radius: 2px; background: var(--azul); color: var(--amarillo); font-weight: 700; display: inline-block; margin-left: 8px; vertical-align: middle; font-family: 'Barlow', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(10,15,25,0.92); z-index: 999; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 85vh; border-radius: 4px; object-fit: contain; }
    .lightbox-close { position: fixed; top: 20px; right: 24px; color: rgba(255,255,255,0.7); font-size: 26px; cursor: pointer; z-index: 1000; background: none; border: none; line-height: 1; }
    .lightbox-close:hover { color: var(--amarillo); }
    .empty { padding: 3rem 1.5rem; text-align: center; color: var(--gris-texto); font-size: 14px; font-family: 'Lora', serif; font-style: italic; }
    .footer { text-align: center; padding: 2rem 1.5rem 1.5rem; font-size: 11px; color: var(--gris-texto); letter-spacing: 0.08em; text-transform: uppercase; border-top: 1px solid var(--gris-calido); margin-top: 1rem; }
    .footer span { color: var(--amarillo); }
    .btn-sumate { position: fixed; bottom: 24px; right: 20px; z-index: 998; display: flex; align-items: center; gap: 10px; background: var(--amarillo); color: var(--azul); font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 20px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 16px rgba(27,46,75,0.35); transition: all 0.15s; }
    .btn-sumate:hover { opacity: 0.9; transform: translateY(-2px); }
  </style>
</head>
<body>
<div id="lb" class="lightbox" onclick="cerrarLb()">
  <button class="lightbox-close" onclick="cerrarLb()">&#x2715;</button>
  <img id="lb-img" src="" alt=""/>
</div>
<header class="header">
  <div class="header-grid"></div>
  <div class="header-inner">
    <div class="logo-wrap">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.77z" fill="#1B2E4B" stroke="#1B2E4B" stroke-width="0.5"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-nombre">Oficio Local</span>
        <span class="logo-ciudad">Mercedes · Buenos Aires</span>
      </div>
    </div>
    <p class="header-tagline">El profesional que necesitás, a una llamada de distancia.</p>
  </div>
</header>
<nav class="chips-bar">
  <div class="chips-inner" id="chips"></div>
</nav>
<main class="main">
  <div class="results-bar"><span class="results-count" id="label"></span></div>
  <div class="card-list" id="lista"></div>
  <footer class="footer">Oficio Local · <span>Mercedes</span> · información provista por cada profesional</footer>
</main>
<a class="btn-sumate" href="planes.html">
  ¿Sos profesional? Sumate
</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://buivjaoxfgvhrsmblxnx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Pv9JKNdeX2hDzZV3YqWfjA_NXYOcy5v';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const RUBROS = [
    { id: 'todos', label: 'Todos' },
    { id: 'electricidad', label: 'Electricidad' },
    { id: 'plomeria', label: 'Plomería' },
    { id: 'gas', label: 'Gas' },
    { id: 'albanileria', label: 'Albañilería' },
    { id: 'herreria', label: 'Herrería' },
    { id: 'jardineria', label: 'Jardinería' },
    { id: 'pintura', label: 'Pintura' },
    { id: 'carpinteria', label: 'Carpintería' }
  ];

  let todos = [];
  let rubroActivo = 'todos';

  function abrirLb(src){ document.getElementById('lb-img').src=src; document.getElementById('lb').classList.add('open'); }
  function cerrarLb(){ document.getElementById('lb').classList.remove('open'); }

  function iniciales(nombre) {
    return nombre.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
  }

  function ordenPlan(plan, fundador) {
    if (plan === 'destacado') return 1;
    if (plan === 'visible' && !fundador) return 2;
    if (fundador) return 3;
    return 4;
  }

  function renderChips() {
    document.getElementById('chips').innerHTML = RUBROS.map(r =>
      `<button class="chip ${r.id === rubroActivo ? 'active' : ''}" onclick="setRubro('${r.id}')">${r.label}</button>`
    ).join('');
  }

  function setRubro(r) { rubroActivo = r; renderChips(); filtrar(); }

  function filtrar() {
    const lista = document.getElementById('lista');
    const label = document.getElementById('label');
    let filtrados = rubroActivo === 'todos' ? [...todos] : todos.filter(p => p.rubro_id === rubroActivo);
    filtrados.sort((a, b) => ordenPlan(a.plan, a.fundador) - ordenPlan(b.plan, b.fundador));
    label.textContent = filtrados.length + ' profesional' + (filtrados.length !== 1 ? 'es' : '');
    if (!filtrados.length) { lista.innerHTML = '<div class="empty">No hay profesionales en este rubro todavía.</div>'; return; }
    lista.innerHTML = filtrados.map(p => `
      <div class="card">
        <div class="card-body">
          <div class="card-top">
            <div class="avatar">${iniciales(p.nombre)}</div>
            <div class="card-meta">
              <div class="card-name">${p.nombre}
                ${p.fundador ? '<span class="badge-fundador">Fundador</span>' : ''}
                ${p.plan === 'destacado' ? '<span class="badge-destacado">Destacado</span>' : ''}
              </div>
              <div class="card-rubro">${p.rubro}</div>
            </div>
          </div>
          <p class="card-desc">${p.descripcion || ''}</p>
          <div class="card-footer">
            <span class="precio"><strong>A convenir</strong></span>
            <a class="wa-btn" href="https://wa.me/${p.telefono}" target="_blank">
              <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.855L.053 23.447a.5.5 0 00.605.605l5.594-1.479A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.9a9.87 9.87 0 01-5.031-1.378l-.36-.214-3.732.986.998-3.648-.235-.374A9.861 9.861 0 012.1 12C2.1 6.532 6.532 2.1 12 2.1c5.468 0 9.9 4.432 9.9 9.9 0 5.468-4.432 9.9-9.9 9.9z"/></svg>
              Contactar
            </a>
          </div>
          ${p.instagram ? `<a class="ig-link" href="https://instagram.com/${p.instagram}" target="_blank">📷 @${p.instagram}</a>` : ''}
        </div>
        ${p.fotos && p.fotos.length ? `<div class="fotos-row">${p.fotos.map(f => `<img class="foto-thumb" src="${f.url}" onclick="abrirLb(this.src)" alt="trabajo" loading="lazy"/>`).join('')}</div>` : ''}
      </div>
    `).join('');
  }

  async function cargar() {
    const { data: especialistas } = await sb.from('especialistas').select('*').eq('activo', true).not('nombre', 'is', null);
    const { data: fotos } = await sb.from('fotos').select('*').order('orden');
    todos = especialistas.map(e => ({
      ...e,
      fotos: fotos.filter(f => f.especialista_id === e.id)
    }));
    renderChips();
    filtrar();
  }

  cargar();
</script>
</body>
</html>
